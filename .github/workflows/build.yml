name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'artifacts/music-player/pnpm-lock.yaml'

      - name: Install dependencies & Sync Capacitor
        run: |
          cd artifacts/music-player
          pnpm install --no-frozen-lockfile
          npx cap sync android || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x artifacts/music-player/android/gradlew

      - name: Build with Gradle
        run: |
          cd artifacts/music-player/android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEMP-debug-apk
          path: artifacts/music-player/android/app/build/outputs/apk/debug/app-debug.apk
